<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Animated Skills Bar</title>
</head>
<body>
  <div class="container">
    <!-- 1st Skill box -->
    <div class="skill-box">
      <span class="title">HTML</span>
      <div class="skill-bar">
        <span class="skill-per html">
          <span class="per-value">90%</span>
        </span>
      </div>
    </div>
    <!-- 2nd Skill box -->
    <div class="skill-box">
      <span class="title">CSS</span>
      <div class="skill-bar">
        <span class="skill-per css">
          <span class="per-value">70%</span>
        </span>
      </div>
    </div>
    <!-- 3rd Skill box -->
    <div class="skill-box">
      <span class="title">Javascript</span>
      <div class="skill-bar">
        <span class="skill-per javascript">
          <span class="per-value">50%</span>
        </span>
      </div>
    </div>
    <!-- 4th Skill box -->
    <div class="skill-box">
      <span class="title">Python</span>
      <div class="skill-bar">
        <span class="skill-per python">
          <span class="per-value">30%</span>
        </span>
      </div>
    </div>
  </div>
</body>
</html>
