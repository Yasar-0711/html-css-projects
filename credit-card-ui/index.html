<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card Ui Design</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <span class="logo">
          <img src="images/logo.png" alt="logo-image"/>
          <h5 class="master-card-text">Master Card</h5>
        </span>
        <img src="images/chip.png" alt="chip-image" class="chip" />
      </header>

      <div class="card-details">
        <div class="name-number">
          <h6>Card Number :</h6>
          <h5 class="number">1020 3040 5060 7080</h5>
          <h5 class="name">Virat Kohli</h5>
        </div>
        <div class="card-valid-date">
          <h6>Valid Thru</h6>
          <h5>05/27</h5>
        </div>
      </div>
    </div>
  </body>
</html>
