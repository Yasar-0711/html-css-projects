<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- REMIX ICONS -->
  <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  <!-- CSS LINK -->
  <link rel="stylesheet" href="styles.css" >
  <title>Profile Card - Responsive</title>
</head>
<body>
  
  <div class="profile-card">
    <div class="image">
      <img src="profile-img.jpg" alt="profile-img" class="profile-img" >
    </div>
    
    <div class="profile-data">
      <span class="name">Alex Jones</span>
      <span class="job">YouTuber & Developer</span>
    </div>
    
    <div class="social-buttons">
      <a href="#" style="background-color:#4267b2;" class="social-link">
        <i class="ri-facebook-fill"></i>
      </a>
      <a href="#" style="background-color:#e1306c;" class="social-link">
        <i class="ri-instagram-line"></i>
      </a>
      <a href="#" style="background-color:#ff0000;" class="social-link">
        <i class="ri-youtube-fill"></i>
      </a>
      <a href="#" style="background-color:#1da1f2;" class="social-link">
        <i class="ri-twitter-fill"></i>
      </a>
    </div>

    <div class="buttons">
      <button class="primary-btn">Subscribe</button>
      <button class="secondary-btn">Message</button>
    </div>
    

    <div class="social-stats">
      <div class="stat-data">
        <i class="ri-heart-line"></i>
        <span>100k</span>
      </div>
      <div class="stat-data">
        <i class="ri-chat-1-line"></i>
        <span>20k</span>
      </div>
      <div class="stat-data">
        <i class="ri-share-forward-line"></i>
        <span>50k</span>
      </div>
    </div>
    
  </div>
</body>
</html>
